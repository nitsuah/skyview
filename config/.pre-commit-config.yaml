repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Security checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key

  # CSS formatting
  # stylelint ships no pre-commit hook definition, so run it as a local node hook.
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        language: node
        entry: stylelint
        additional_dependencies: [stylelint@17.15.0, stylelint-config-standard@40.0.0]
        args: [--fix, --config, config/stylelint.config.mjs]
        files: \.(css)$