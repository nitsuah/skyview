# Docker/nginx equivalent of the Netlify redirect rules in netlify.toml that
# matter for local parity: SPA fallback for the marketplace platform at /app.
# (The legacy /*.html -> /pages/*.html redirects are Netlify-only convenience
# routes; this container serves the built dist/ tree directly.)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Platform SPA — client-side routing for the React app built into /app.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
