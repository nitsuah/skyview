<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Your Project Gallery - Skyview Aerial Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
    <style>
        .client-header {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            padding: 2rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .client-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .client-info h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .client-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        .logout-button {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .logout-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .client-gallery-section {
            padding: 4rem 0;
            background: #0a0a0a;
        }

        .download-banner {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 102, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .download-banner h2 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .download-banner p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1.5rem;
        }

        .download-all-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .download-all-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .gallery-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-button {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .filter-button:hover,
        .filter-button.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: white;
        }

        .client-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .client-gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .client-gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .client-gallery-item img,
        .client-gallery-item video {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .client-gallery-item-info {
            padding: 1.5rem;
        }

        .client-gallery-item-title {
            color: white;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .client-gallery-item-meta {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-button {
            flex: 1;
            padding: 0.75rem;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .action-button:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 212, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent white;
            margin-left: 4px;
        }

        @media (max-width: 768px) {
            .client-gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        .client-gallery-item-thumb {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.4);
        }

        .gallery-empty-state,
        .gallery-loading-state {
            color: rgba(255, 255, 255, 0.6);
            padding: 2rem 0;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Client Header -->
    <header class="client-header">
        <div class="container">
            <div class="client-info">
                <h1 id="projectName">Your Project Gallery</h1>
                <p id="projectDate">Delivered: December 2025</p>
            </div>
            <a href="/pages/client-portal.html" id="logoutLink" class="logout-button">← Back to Portal</a>
        </div>
    </header>

    <!-- Client Gallery Section -->
    <section class="client-gallery-section">
        <div class="container">
            <!-- Download Banner -->
            <div class="download-banner">
                <h2>📦 Your Complete Package</h2>
                <p>Download all your high-resolution photos and videos in one ZIP file</p>
                <a href="#" class="download-all-button" id="downloadAll">
                    Download All Files (2.4 GB)
                </a>
            </div>

            <!-- Gallery Filters -->
            <div class="gallery-filters">
                <button class="filter-button active" data-filter="all">All Files</button>
                <button class="filter-button" data-filter="photo">Photos</button>
                <button class="filter-button" data-filter="video">Videos</button>
                <button class="filter-button" data-filter="raw">RAW Files</button>
            </div>

            <!-- Gallery Grid — populated by JS from GET /api/portal/files
                 once the session token is re-verified server-side. -->
            <div class="client-gallery-grid" id="clientGallery">
                <div class="gallery-loading-state">Loading your files…</div>
            </div>
        </div>
    </section>

    <script src="/scripts/client-gallery.js" referrerpolicy="no-referrer"></script>
</body>

</html>
