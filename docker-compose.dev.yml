version: "3.9"

services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      # Netlify dev needs these to wire up to the right Netlify site
      - NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN:-}
      - NETLIFY_SITE_ID=${NETLIFY_SITE_ID:-}
    volumes:
      # Mount source for hot reload — node_modules come from the image
      - .:/app
      - /app/node_modules
      - /app/platform/node_modules
