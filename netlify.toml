# Netlify Configuration

[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Daily cert expiry checker — runs at 9am UTC
[functions."cron-cert-expiry"]
  schedule = "0 9 * * *"

# Platform SPA — client-side routing for React app at /app
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
  force = false

# Backward-compat redirects for pages moved to /pages/
[[redirects]]
  from = "/client-gallery.html"
  to = "/pages/client-gallery.html"
  status = 301

[[redirects]]
  from = "/client-portal.html"
  to = "/pages/client-portal.html"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/pages/privacy.html"
  status = 301

[[redirects]]
  from = "/thank-you.html"
  to = "/pages/thank-you.html"
  status = 301

# Catch-all for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com https://plausible.io https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src https://fonts.gstatic.com; frame-src https://calendly.com; connect-src 'self' https://plausible.io https://api.netlify.com https://identity.netlify.com; img-src 'self' data: https:; media-src 'self';"

# Platform app — Stripe-compatible CSP, no Calendly
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; img-src 'self' data: blob: https:; media-src 'self';"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.netlify.com https://identity.netlify.com; img-src 'self' data: https:; frame-ancestors 'none';"

[[headers]]
  for = "/client-portal.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/client-gallery.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
